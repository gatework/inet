name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    if: github.repository == 'gatework/inet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    concurrency:
      group: rubygems-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inet-gem-${{ github.sha }}
          path: pkg
      - name: Verify CI checksum
        working-directory: pkg
        run: sha256sum --check SHA256SUMS
      - name: Check version, source and published state
        id: release
        run: |
          version=$(ruby -Ilib -rinet/version -e 'print Inet::VERSION')
          bundle exec ruby script/release.rb prepare "pkg/inet-${version}.gem"
      - name: Configure RubyGems Trusted Publishing
        if: steps.release.outputs.release_needed == 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish exact CI artifact and verify RubyGems
        if: steps.release.outputs.release_needed == 'true'
        env:
          ARTIFACT: ${{ steps.release.outputs.artifact }}
        run: bundle exec ruby script/release.rb publish "pkg/$ARTIFACT"
      - name: Publish GitHub Release and verify assets
        if: steps.release.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ARTIFACT: ${{ steps.release.outputs.artifact }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "$TAG" --notes-file pkg/release-notes.md
          fi
          gh release upload "$TAG" "pkg/$ARTIFACT" pkg/SHA256SUMS --clobber
          mkdir -p "$RUNNER_TEMP/inet-release-readback"
          gh release download "$TAG" --dir "$RUNNER_TEMP/inet-release-readback" --clobber
          cmp "pkg/$ARTIFACT" "$RUNNER_TEMP/inet-release-readback/$ARTIFACT"
          cmp pkg/SHA256SUMS "$RUNNER_TEMP/inet-release-readback/SHA256SUMS"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > pkg/published-tags.txt
          latest=$(bundle exec ruby -r./script/release -e \
            'puts Release.latest?(File.readlines(ARGV[0], chomp: true), ARGV[1].delete_prefix("v"))' \
            pkg/published-tags.txt "$TAG")
          gh release edit "$TAG" --draft=false "--latest=$latest"
          git fetch origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          gh release view "$TAG" --json url,isDraft,tagName
